# gitleaks configuration for the Megi repository.
#
# The default ruleset is used as-is; local additions are narrow allowlists for
# documented false positives (CHANGELOG prose, vendored HTML, RFC test vectors,
# and WPT canonical keys). Every entry is scoped to one rule and to exact
# paths/commits, so a real credential added anywhere else still fails the gate.

[extend]
useDefault = true

[[allowlists]]
description = "CHANGELOG prose triggers the generic-api-key entropy heuristic"
paths = ['''^CHANGELOG\.md$''']
rules = ["generic-api-key"]

[[allowlists]]
description = "Vendored real-site HTML fixture: minified page scripts trip the generic-api-key entropy heuristic"
paths = ['''^tests/fixtures/real-sites/wikipedia\.html$''']
rules = ["generic-api-key"]

[[allowlists]]
description = "RFC 6455 sample Sec-WebSocket-Key in WebSocket tests is a public constant, not a credential"
paths = ["^crates/net/src/websocket\\.rs$", "^crates/net/src/websocket/tests\\.rs$"]
rules = ["generic-api-key"]

[[allowlists]]
description = "RFC 6455 §1.3 Sec-WebSocket-Accept example test vector in historical commit (not a secret)"
commits = ["5c7cd0d942374d27eb3be1600a12cdf1267f8b8c"]
rules = ["generic-api-key"]

[[allowlists]]
description = "docs/status/wpt.json WPT subtest keys are public sha256(test + NUL + subtest) canonical identifiers, not credentials"
paths = ['''^docs/status/wpt\.json$''']
rules = ["generic-api-key"]

[[allowlists]]
description = "RFC 6455 section 1.3 example Sec-WebSocket-Key/Accept pair in DevTools protocol tests is a public test vector, not a credential"
paths = ["^crates/browser/tests/devtools_protocol\\.rs$"]
rules = ["generic-api-key"]
