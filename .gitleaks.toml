# gitleaks configuration for the Megi repository.
#
# The default ruleset is used as-is; the only local addition is an allowlist for
# a documented false positive: `CHANGELOG.md` is prose and one English sentence
# ("layout fingerprint and CSS parse caching …") trips the `generic-api-key`
# entropy heuristic. Nothing else in the tree is exempt, and the allowlist is
# scoped to that single rule and that single file so a real credential added
# anywhere else — including elsewhere in the changelog — still fails the gate.

[extend]
useDefault = true

[[allowlists]]
description = "CHANGELOG prose triggers the generic-api-key entropy heuristic"
paths = ['''^CHANGELOG\.md$''']
rules = ["generic-api-key"]
