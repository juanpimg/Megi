[package]
name = "megi-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

# Standalone workspace on purpose: the fuzzing harness needs its own dependency graph
# (libfuzzer-sys, nightly/ASan) and must not alter the main workspace's lockfile or CI.
# The parser crates are plain path dependencies of the root workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
dom = { path = "../crates/dom" }
html = { path = "../crates/html" }
css = { path = "../crates/css" }
net = { path = "../crates/net" }
image = { path = "../crates/image" }
render = { path = "../crates/render" }
js = { path = "../crates/js" }
svg = { path = "../crates/svg" }

[[bin]]
name = "html_parse"
path = "fuzz_targets/html_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "css_parse"
path = "fuzz_targets/css_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selectors"
path = "fuzz_targets/selectors.rs"
test = false
doc = false
bench = false

[[bin]]
name = "net_url"
path = "fuzz_targets/net_url.rs"
test = false
doc = false
bench = false

# Round 18 (R105): new surfaces.
[[bin]]
name = "render_pipeline"
path = "fuzz_targets/render_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "js_eval"
path = "fuzz_targets/js_eval.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg_parse"
path = "fuzz_targets/svg_parse.rs"
test = false
doc = false
bench = false

