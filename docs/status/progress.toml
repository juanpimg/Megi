# Megi Browser Engine — progress manifest (source of truth for the generated status page).
#
# Model (v2, 2026-11-24): every [[phase]] entry is a milestone M0..M12 from the approved
# roadmap (docs/superpowers/specs/2026-11-24-megi-ambition-design.md §4.1). Each entry lists
# acceptance criteria in `items` (verified) or `pending` (not verified yet). Every criterion
# cites the evidence that supports the decision: a command, an artifact or the exact current
# gap. The percentage is DERIVED by tools/update_progress.py from those two lists — it is
# never written by hand, so no estimate can be mistaken for measured progress.
#
# A milestone closes only when `pending` is empty. The headline counts closed milestones and
# verified criteria across the whole roadmap. Capability coverage (coverage.toml) remains a
# separate, self-referential report and is no longer used as the progress headline.
#
# Regenerate after editing:
#     python3 tools/update_progress.py --write            # with full test count + gate
#     python3 tools/update_progress.py --write --no-gate  # skip the conformance gate
#     python3 tools/update_progress.py --check --no-gate --no-count  # CI freshness
#
# The [stats]/[gate] blocks are GENERATED by the script (do not edit by hand).

last_updated_by = "docs: milestone-based progress model (spec v2 §4.1)"
