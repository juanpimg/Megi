# This file is hand-edited by contributors/agents when a phase advances; the generated
# artifacts (`PROGRESS.md`, `docs/status/progress.svg`, `docs/status/badge-*.svg`) are
# produced from it plus **real repository statistics** by `tools/update_progress.py`.
#
# Regenerate after editing:
#     python3 tools/update_progress.py --write            # with full test count + gate
