[workspace]
resolver = "2"
members = [
    "crates/dom",
    "crates/html",
    "crates/css",
    "crates/layout",
    "crates/test_harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Megi Engine Contributors"]
repository = "https://github.com/juanpimg/Megi"

[workspace.dependencies]
dom = { path = "crates/dom" }
html = { path = "crates/html" }
css = { path = "crates/css" }
layout = { path = "crates/layout" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

