[workspace]
resolver = "2"
members = [
    "crates/dom",
    "crates/html",
    "crates/css",
    "crates/layout",
    "crates/fonts",
    "crates/image",
    "crates/paint",
    "crates/net",
    "crates/render",
    "crates/shell",
    "crates/js",
    "crates/svg",
    "crates/test_harness",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Megi Engine Contributors"]
repository = "https://github.com/juanpimg/Megi"

[workspace.dependencies]
dom = { path = "crates/dom", version = "0.1.0" }
html = { path = "crates/html", version = "0.1.0" }
css = { path = "crates/css", version = "0.1.0" }
layout = { path = "crates/layout", version = "0.1.0" }
fonts = { path = "crates/fonts", version = "0.1.0" }
image = { path = "crates/image", version = "0.1.0" }
paint = { path = "crates/paint", version = "0.1.0" }
net = { path = "crates/net", version = "0.1.0" }
render = { path = "crates/render", version = "0.1.0" }
shell = { path = "crates/shell", version = "0.1.0" }
js = { path = "crates/js", version = "0.1.0" }
svg = { path = "crates/svg", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Phase 5 network dependencies authorized by docs/ARCHITECTURE.md §3.1:
# TLS transport (rustls + Mozilla root store) and offline TLS test cert generation.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
webpki-roots = "1.0"
rcgen = "0.13"

# Phase 7 desktop shell dependencies authorized by docs/ARCHITECTURE.md §3.1:
# cross-platform window creation/event loop and CPU framebuffer presentation (no GPU).
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "wayland"] }

# Phase 6 JavaScript dependency authorized by docs/JAVASCRIPT-STRATEGY.md (ADR-001):
# embedded ECMAScript engine (component, not core parser/layout engine).
boa_engine = "0.22"

# Low-level font dependencies authorized by docs/ARCHITECTURE.md §3.1.
ab_glyph = "0.2"
fontdb = "0.24"
rustybuzz = "0.20"
ttf-parser = "0.25"

# Property-based testing dev-dependency (#961).
proptest = "1"
