[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/html",
    "crates/css",
    "crates/layout",
    "crates/fonts",
    "crates/image",
    "crates/display",
    "crates/raster",
    "crates/paint",
    "crates/net",
    "crates/render",
    "crates/webview",
    "crates/browser",
    "crates/js",
    "crates/svg",
    "crates/test_harness",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Megi Engine Contributors"]
repository = "https://github.com/juanpimg/Megi"

[workspace.dependencies]
megi-core = { path = "crates/core", version = "0.1.0" }
megi-html = { path = "crates/html", version = "0.1.0" }
megi-css = { path = "crates/css", version = "0.1.0" }
megi-layout = { path = "crates/layout", version = "0.1.0" }
megi-fonts = { path = "crates/fonts", version = "0.1.0" }
megi-image = { path = "crates/image", version = "0.1.0" }
megi-display = { path = "crates/display", version = "0.1.0" }
megi-raster = { path = "crates/raster", version = "0.1.0" }
megi-paint = { path = "crates/paint", version = "0.1.0" }
megi-net = { path = "crates/net", version = "0.1.0" }
megi-render = { path = "crates/render", version = "0.1.0", default-features = false }
megi-webview = { path = "crates/webview", version = "0.1.0" }
megi-browser = { path = "crates/browser", version = "0.1.0" }
megi-js = { path = "crates/js", version = "0.1.0" }
megi-svg = { path = "crates/svg", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Phase 5 network dependencies authorized by docs/ARCHITECTURE.md §3.1:
# TLS transport (rustls + Mozilla root store) and offline TLS test cert generation.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
webpki-roots = "1.0"
rcgen = "0.14"

# Phase 7 desktop shell dependencies authorized by docs/ARCHITECTURE.md §3.1:
# cross-platform window creation/event loop and CPU framebuffer presentation (no GPU).
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "wayland"] }

# Phase 6 JavaScript dependency authorized by docs/JAVASCRIPT-STRATEGY.md (ADR-001):
# embedded ECMAScript engine (component, not core parser/layout engine).
boa_engine = "0.22"

# Low-level font dependencies authorized by docs/ARCHITECTURE.md §3.1.
ab_glyph = "0.2"
fontdb = "0.24"
rustybuzz = "0.20"
ttf-parser = "0.25"

# Property-based testing dev-dependency (#961).
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
