<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inline module</title>
<style>html, body { margin: 0; background: #ffffff; }
#out { width: 10px; height: 10px; background-color: #ff0000; }
</style></head>
<body>
<div id="out"></div>
<script type="module">
const out = document.getElementById("out");
out.style.width = "40px";
out.style.height = "20px";
out.style.backgroundColor = "#00ff00";
</script>
</body>
</html>
