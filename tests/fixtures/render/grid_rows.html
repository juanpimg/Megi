<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid rows</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:220px; margin:10px">
    <div style="height:20px;background:#ff0000"></div>
    <div style="height:40px;background:#00ff00"></div>
    <div style="height:30px;background:#0000ff"></div>
    <div style="height:10px;background:#ffff00"></div>
  </div>
</body></html>
