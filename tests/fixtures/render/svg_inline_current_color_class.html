<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inline SVG currentColor from CSS class</title>
<style>html, body { margin: 0; padding: 0; background-color: #ffffff; }
.icon-host { color: #008000; }</style></head>
<body>
<div class="icon-host"><svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" fill="none" stroke="currentColor" stroke-width="4"/></svg></div>
</body>
</html>
