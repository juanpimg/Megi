<!doctype html>
<html>
<head><meta charset="utf-8"><title>Software WebGL 1 triangle</title></head>
<body style="margin:0;background:#ffffff">
<canvas id="scene" width="400" height="260"></canvas>
<script>
  // M6#4: deterministic software WebGL 1 raster (WebGL 1.0 §2.11, §3.3).
  var canvas = document.getElementById('scene');
  var gl = canvas.getContext('webgl');
  gl.viewport(0, 0, 400, 260);
  gl.clearColor(0.05, 0.07, 0.12, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // One triangle in clip space, rasterised with the deterministic edge function.
  gl.vertices = [-0.6, -0.6, 0.6, -0.6, 0, 0.6];
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // Exercise the buffer object path used by the vendored conformance case.
  var buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([1, 2, 3]), gl.STATIC_DRAW);
  gl.bufferSubData(gl.ARRAY_BUFFER, 4, new Float32Array([9]));
  var error = gl.getError();
  // The golden only encodes the visible triangle; `error` stays observable to JS tests.
</script>
</body>
</html>
