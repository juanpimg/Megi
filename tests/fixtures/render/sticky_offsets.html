<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>position: sticky fixture</title>
<style>
  html, body { margin: 0; padding: 0; background-color: #ffffff; }
  .flow { width: 320px; height: 40px; margin: 0; background-color: #336699; color: #ffffff;
          font: bold 16px sans-serif; }
  .sticky { position: sticky; top: 12px; left: 24px; width: 160px; height: 40px;
            background-color: #ff8800; color: #000000; font: bold 16px sans-serif; }
</style></head>
<body>
  <div class="flow">flow A</div>
  <div class="sticky">sticky</div>
  <div class="flow">flow B</div>
</body></html>
