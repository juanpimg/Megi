<!doctype html><html><head><meta charset="utf-8"><title>Megi animation time fixture</title><style>
html, body { margin: 0; background: #ffffff; }
#box { width: 100px; height: 100px; background: #ff0000; animation: fade 1000ms linear both; }

</style></head><body><div id="box"></div></body></html>
