<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>Forms</title></head>
  <body>
    <form>
      <fieldset>
        <legend>Form controls</legend>
        <label>Name <input type="text" name="name" value="Megi" placeholder="Your name"></label>
        <label>Bio <textarea name="bio" rows="2" cols="30">Hello</textarea></label>
        <label>Pick <select name="pick"><option>One</option><option>Two</option></select></label>
        <label><input type="checkbox" name="check" checked> Checked</label>
        <label><input type="radio" name="radio" checked> Radio</label>
        <input type="submit" value="Send">
        <button type="button">Press</button>
        <input type="text" disabled value="Disabled">
      </fieldset>
    </form>
  </body>
</html>
