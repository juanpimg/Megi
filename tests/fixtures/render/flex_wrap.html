<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>flex wrap</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:flex; flex-wrap:wrap; width:120px; row-gap:10px; column-gap:10px; margin:10px">
    <div style="flex:0 0 50px;height:20px;background:#ff0000"></div>
    <div style="flex:0 0 50px;height:20px;background:#00ff00"></div>
    <div style="flex:0 0 50px;height:20px;background:#0000ff"></div>
    <div style="flex:0 0 50px;height:20px;background:#ffff00"></div>
  </div>
</body></html>
