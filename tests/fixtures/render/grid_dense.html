<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid dense</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:60px 60px 60px; grid-auto-flow:row dense; gap:5px; margin:10px">
    <div style="grid-column:3;height:20px;background:#ff0000"></div>
    <div style="height:20px;background:#00ff00"></div>
    <div style="height:20px;background:#0000ff"></div>
  </div>
</body></html>
