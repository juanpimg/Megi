<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Megi linear-gradient fixture</title>
<style>
  html, body { margin: 0; padding: 0; background-color: #ffffff; }
  .horizontal { width: 160px; height: 40px; margin: 8px; background-image: linear-gradient(to right, #ff0000, #0000ff); }
  .diagonal   { width: 160px; height: 40px; margin: 8px; background-image: linear-gradient(45deg, #f2aa4c 0%, #336699 100%); }
  .repeating  { width: 160px; height: 40px; margin: 8px; background-image: repeating-linear-gradient(90deg, #101820 0 10px, #dde6f2 10px 20px); }
  .sized      { width: 160px; height: 40px; margin: 8px; background-color: #f4f7fb; background-image: linear-gradient(135deg, transparent 0%, #336699 100%); background-size: 40px 40px; background-position: 20px 0; background-repeat: no-repeat; }
  .rounded    { width: 160px; height: 40px; margin: 8px; border-radius: 20px; background-image: radial-gradient(circle at center, #f2aa4c, #101820); }
  .text-clip  { width: 160px; height: 44px; margin: 8px; background-image: linear-gradient(to right, #ff0000, #0000ff); -webkit-background-clip: text; background-clip: text; }
  .text-clip span { color: transparent; font: bold 34px sans-serif; }
</style></head>
<body>
  <div class="horizontal"></div>
  <div class="diagonal"></div>
  <div class="repeating"></div>
  <div class="sized"></div>
  <div class="rounded"></div>
  <div class="text-clip"><span>GRADIENT</span></div>
</body></html>
