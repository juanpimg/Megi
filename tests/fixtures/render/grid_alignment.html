<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid alignment</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:100px 100px; grid-template-rows:80px; justify-items:center; align-items:center; width:200px; margin:10px">
    <div style="width:40px;height:20px;background:#ff0000"></div>
    <div style="width:40px;height:20px;background:#0000ff;justify-self:end;align-self:end"></div>
  </div>
</body></html>
