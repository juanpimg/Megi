<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid areas</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:100px 100px; grid-template-rows:50px 50px; grid-template-areas:'header header' 'main side'; gap:5px; margin:10px">
    <div style="grid-area:header;background:#ff0000"></div>
    <div style="grid-area:main;background:#00ff00"></div>
    <div style="grid-area:side;background:#0000ff"></div>
  </div>
</body></html>
