<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>js event domcontentloaded</title></head>
  <body>
    <div id="out">before</div>
    <div id="win">before</div>
    <script>
      // DOMContentLoaded is dispatched at the `document` target with bubbling by the host.
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('out').textContent = 'dcl-document';
      });
      window.addEventListener('DOMContentLoaded', function () {
        document.getElementById('win').textContent = 'dcl-window';
      });
    </script>
  </body>
</html>
