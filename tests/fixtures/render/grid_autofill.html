<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid autofill</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(60px, 1fr)); gap:10px; width:220px; margin:10px">
    <div style="height:20px; background:#ff0000"></div>
    <div style="height:20px; background:#00ff00"></div>
    <div style="height:20px; background:#0000ff"></div>
    <div style="height:20px; background:#ffff00"></div>
  </div>
</body></html>
