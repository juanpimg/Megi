<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Multiple inline SVGs fixture</title>
<style>html, body { margin: 0; padding: 0; background-color: #ffffff; }
svg, img { display: block; }</style></head>
<body>
<svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" fill="#ff0000"/></svg>
<svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" fill="#0000ff"/></svg>
<svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" fill="#00ff00"/></svg>
</body>
</html>
