<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inline SVG inline-block fixture</title>
<style>html, body { margin: 0; padding: 0; background-color: #ffffff; }
.row { display: inline-block; vertical-align: top; }
.icon { width: 32px; height: 32px; display: block; }
</style></head>
<body>
<div class="row"><svg class="icon" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="#00ff00"/></svg></div>
</body>
</html>
