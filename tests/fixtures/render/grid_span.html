<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid span</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:100px 100px 100px; gap:10px; width:320px; margin:10px">
    <div style="grid-column:span 2; height:20px; background:#ff0000"></div>
    <div style="height:20px; background:#00ff00"></div>
    <div style="grid-row:span 2; height:60px; background:#0000ff"></div>
    <div style="height:20px; background:#ffff00"></div>
    <div style="height:20px; background:#00ffff"></div>
  </div>
</body></html>
