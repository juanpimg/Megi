<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>text-transform fixture</title>
<style>
  html, body { margin: 0; padding: 0; background-color: #ffffff; }
  p { margin: 8px; font: 20px sans-serif; }
  .upper { text-transform: uppercase; color: #cc0000; }
  .lower { text-transform: lowercase; color: #008800; }
  .cap { text-transform: capitalize; color: #0000cc; }
</style></head>
<body>
  <p class="upper">Hello World</p>
  <p class="lower">HeLLo WoRLD</p>
  <p class="cap">hello big world</p>
</body></html>
