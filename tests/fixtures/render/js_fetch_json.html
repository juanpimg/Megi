<!doctype html><html><body>
<div id="out">pending</div>
<script>
fetch('fetch_data.json').then(function (r) { return r.json(); }).then(function (data) {
  document.getElementById('out').textContent = 'value=' + data.answer + ':' + data.name;
}).catch(function (error) { document.getElementById('out').textContent = 'error:' + error; });
</script>
</body></html>
