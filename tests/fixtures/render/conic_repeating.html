<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Megi repeating-conic-gradient fixture</title>
<style>
  html, body { margin: 0; padding: 0; background-color: #ffffff; }
  .stripes {
    width: 120px; height: 120px; margin: 8px;
    background-image: repeating-conic-gradient(from 0deg at center, #101820 0 6deg, #dde6f2 6deg 12deg);
  }
  .star {
    width: 120px; height: 120px; margin: 8px; border-radius: 24px;
    background-color: #101820;
    background-image: repeating-conic-gradient(#f2aa4c 0 9deg, transparent 9deg 18deg);
  }
</style></head>
<body>
  <div class="stripes"></div>
  <div class="star"></div>
</body></html>
