<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Megi radial-gradient fixture</title>
<style>
  html, body { margin: 0; padding: 0; background-color: #ffffff; }
  .circle   { width: 120px; height: 80px; margin: 8px; background-image: radial-gradient(circle, #f2aa4c 0%, #336699 100%); }
  .ellipse  { width: 120px; height: 80px; margin: 8px; background-image: radial-gradient(ellipse farthest-side at 25% 75%, #101820, #dde6f2); }
  .explicit { width: 120px; height: 80px; margin: 8px; background-image: radial-gradient(ellipse 40px 20px at center, #ff0000, #0000ff); }
  .repeat   { width: 120px; height: 80px; margin: 8px; background-image: repeating-radial-gradient(circle at center, #f2aa4c 0 6px, #101820 6px 12px); }
  .alpha    { width: 120px; height: 80px; margin: 8px; background-color: #ffffff; background-image: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 100%); }
</style></head>
<body>
  <div class="circle"></div>
  <div class="ellipse"></div>
  <div class="explicit"></div>
  <div class="repeat"></div>
  <div class="alpha"></div>
</body></html>
