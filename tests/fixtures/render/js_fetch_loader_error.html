<!doctype html><html><body>
<div id="out">pending</div>
<script>
// `sub` is an in-directory path that the loader rejects (it names a directory, not a
// regular file), so fetch() must reject instead of resolving with a synthetic 404.
fetch('sub').then(function (r) {
  document.getElementById('out').textContent = 'ok=' + r.ok + ':status=' + r.status;
}).catch(function (error) { document.getElementById('out').textContent = 'rejected:' + error; });
</script>
</body></html>
