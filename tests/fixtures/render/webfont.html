<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Open Sans Web";
    src: url("OpenSans-Regular-latin.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-size: 28px; line-height: 1.3; }
  #web { font-family: "Open Sans Web", "DejaVu Sans", sans-serif; color: #102030; }
  #fallback { font-family: "DejaVu Sans", sans-serif; color: #102030; }
</style>
</head>
<body>
  <div id="web">Web font pipeline: WWW @font-face</div>
  <div id="fallback">Fallback comparison: WWW @font-face</div>
</body>
</html>
