<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>calc width</title></head>
<body style="margin:0;background:#ffffff">
  <div style="width:400px;margin:10px">
    <div style="width:calc(100% - 40px);height:20px;background:#ff0000"></div>
    <div style="width:calc(50% + 10px);height:20px;background:#00ff00"></div>
  </div>
</body></html>
