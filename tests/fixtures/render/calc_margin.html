<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>calc margin</title></head>
<body style="margin:0;background:#ffffff">
  <div style="width:400px;margin:10px">
    <div style="width:100px;height:20px;margin-left:calc(50% - 20px);background:#ff0000"></div>
    <div style="width:100px;height:20px;margin-left:calc(1em + 5px);background:#0000ff"></div>
  </div>
</body></html>
