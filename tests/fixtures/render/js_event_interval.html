<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>js event interval</title></head>
  <body>
    <div id="out">before</div>
    <script>
      var ticks = 0;
      var id = setInterval(function () {
        ticks += 1;
        document.getElementById('out').textContent = 'ticks:' + ticks;
        if (ticks === 3) {
          clearInterval(id);
        }
      }, 5);
    </script>
  </body>
</html>
