<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>grid content</title></head>
<body style="margin:0;background:#ffffff">
  <div style="display:grid; grid-template-columns:60px 60px; justify-content:space-between; width:300px; margin:10px">
    <div style="height:20px;background:#ff0000"></div>
    <div style="height:20px;background:#00ff00"></div>
  </div>
  <div style="display:grid; grid-template-columns:60px; grid-template-rows:40px 40px; align-content:center; height:200px; margin:10px">
    <div style="background:#0000ff"></div>
    <div style="background:#ffff00"></div>
  </div>
</body></html>
