<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inline SVG currentColor nested inheritance</title>
<style>html, body { margin: 0; padding: 0; background-color: #ffffff; }</style></head>
<body>
<div style="color: rgb(0, 0, 255)"><div><span><svg width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" fill="currentColor"/></svg></span></div></div>
</body>
</html>
