<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>JS storage read</title></head>
<body style="margin:0;background:#ffffff">
<p id="local" style="margin:0;color:#000000">local:missing</p>
<p id="session" style="margin:0;color:#000000">session:missing</p>
<script>
const local = localStorage.getItem("shared-key");
document.getElementById("local").textContent = "local:" + (local === "shared-value" ? "ok" : "missing");
const session = sessionStorage.getItem("session-key");
document.getElementById("session").textContent = "session:" + (session === null ? "isolated" : "leaked");
</script>
</body>
</html>
