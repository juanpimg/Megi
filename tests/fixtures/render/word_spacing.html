<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>word/letter spacing fixture</title>
<style>
  html, body { margin: 0; padding: 0; background-color: #ffffff; }
  p { margin: 8px; font: 20px sans-serif; color: #222222; }
  .words { word-spacing: 16px; }
  .letters { letter-spacing: 4px; }
  .both { word-spacing: 10px; letter-spacing: 2px; color: #006600; }
</style></head>
<body>
  <p class="words">one two three</p>
  <p class="letters">spaced letters</p>
  <p class="both">combined spacing</p>
</body></html>
