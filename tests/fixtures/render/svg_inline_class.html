<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Inline SVG CSS class fixture</title>
<style>html, body { margin: 0; padding: 0; background-color: #ffffff; }
.icon { width: 48px; height: 24px; display: block; }</style></head>
<body>
<svg class="icon" viewBox="0 0 48 24"><rect width="48" height="24" fill="#ffcc00"/></svg>
</body>
</html>
