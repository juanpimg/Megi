<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Megi Phase 4 basic fixture</title>
<style>
  html {
    background-color: #eef2f7;
  }
  body {
    margin: 8px;
    color: #1a1a1a;
    font-family: sans-serif;
    font-size: 16px;
  }
  h1 {
    color: #14213d;
    font-size: 24px;
    margin-block: 12px;
  }
  p {
    color: #222222;
    margin-block: 6px;
  }
  .accent {
    color: #c1121f;
    font-weight: bold;
  }
  #card {
    background-color: #ffffff;
    border-top-width: 3px;
    border-top-style: solid;
    border-top-color: #336699;
    border-right-width: 3px;
    border-right-style: solid;
    border-right-color: #2a9d8f;
    border-bottom-width: 4px;
    border-bottom-style: dashed;
    border-bottom-color: #e76f51;
    border-left-width: 3px;
    border-left-style: double;
    border-left-color: #6a4c93;
    padding: 12px;
    margin-block: 10px;
  }
  ul {
    margin-block: 6px;
    padding-inline: 24px;
  }
  li {
    color: #333333;
  }
  hr {
    border: 1px solid #999999;
    margin-block: 10px;
  }
  a {
    color: #0b5fff;
  }
</style>
</head>
<body>
<h1>Megi Phase 4</h1>
<p>HTML to PNG with <span class="accent">propagated</span> canvas background.</p>
<p>Second paragraph<br>after a line break.</p>
<ul>
<li>Deterministic PNG encoder</li>
<li>Canvas propagation, CSS 2.2 section 14.2</li>
<li>Text advance taken from layout</li>
</ul>
<div id="card">
<p>Card with padding, border and background.</p>
</div>
<hr>
<p><a href="https://example.org/">link</a> and plain text.</p>
</body>
</html>
