name: Fuzz (nightly)

# Nightly libFuzzer runs over every parser/renderer surface that consumes untrusted
# input (16 targets): the 9 critical parsers/decoders run 10 minutes each, the remaining
# targets 5 minutes. Pull requests get a fast "build every target" job instead.
# Not a substitute for a long-running fuzzing farm: the scheduled job is a daily
# regression gate that keeps the harnesses compiling and catches shallow crashes.
#
# Run it on demand from the Actions tab (`workflow_dispatch`) or locally:
#   cd fuzz && cargo +nightly fuzz build
#   cd fuzz && cargo +nightly fuzz run html_parse -- -max_total_time=30
# See docs/FUZZING.md for the full local workflow and triage policy.

on:
  schedule:
    # Every day at 03:17 UTC (off-peak, away from the top-of-hour Actions spike).
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz-nightly.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast PR gate: cargo-fuzz needs nightly (it passes `-Zsanitizer=…` to rustc), so a
  # stable-only build job is not viable. This job compiles every target on nightly but does
  # not run libFuzzer, keeping PR feedback cheap (~few minutes with the rust-cache below).
  build:
    name: build all fuzz targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

  fuzz:
    name: fuzz ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 10 minutes for the critical parsers/decoders (R228).
          - target: html_parse
            seconds: 600
            extra: ""
          - target: css_parse
            seconds: 600
            extra: ""
          - target: selectors
            seconds: 600
            extra: ""
          - target: net_url
            seconds: 600
            extra: ""
          # Round 18 (R105): render pipeline, JavaScript host and SVG.
          - target: render_pipeline
            seconds: 600
            extra: ""
          - target: js_eval
            # Boa 0.21 leaks a constant ~56 bytes / 2 allocations once per process (checked
            # with -runs=1/10/50: it does not grow per iteration). This is a third-party
            # one-time allocation, not a memory-safety bug in the host; run without LSan
            # like other Boa embeddings do, see docs/FUZZING.md.
            seconds: 600
            extra: "-detect_leaks=0"
          - target: svg_parse
            seconds: 600
            extra: ""
          # Round 24 (R151): image decoders/EXIF and HTTP/2 HPACK + framing.
          - target: image_decode
            seconds: 600
            extra: ""
          - target: exif_parse
            seconds: 300
            extra: ""
          - target: hpack_decode
            seconds: 600
            extra: ""
          # Round 29 (R190): HTTP/2 server push, streaming bodies, WebP lossy/lossless
          # sniffing and ES modules + import maps (Boa leak flag as js_eval).
          - target: h2_push
            seconds: 300
            extra: ""
          - target: body_stream
            seconds: 300
            extra: ""
          - target: webp_vp8
            seconds: 300
            extra: ""
          - target: js_module
            seconds: 300
            extra: "-detect_leaks=0"
          # Round 34 (R228): VP8 lossy keyframe decoder + CSS container queries.
          - target: webp_lossy
            seconds: 300
            extra: ""
          - target: container_queries
            seconds: 300
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          # The fuzz harness lives in its own workspace (fuzz/), so cache its target dir.
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz build ${{ matrix.target }}

      # 600 s for the 9 critical parsers/decoders and 300 s for the rest: a daily smoke
      # run, not a coverage-maximising campaign. Raise it via workflow_dispatch edits or
      # run the corpus longer locally before a release.
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=${{ matrix.seconds }}
          -rss_limit_mb=2048
          -timeout=25
          ${{ matrix.extra }}
          -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
