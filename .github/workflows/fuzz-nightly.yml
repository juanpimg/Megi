name: Fuzz (nightly)

# Nightly libFuzzer runs over every parser/renderer surface that consumes untrusted
# input (26 harnesses): the 9 critical parsers/decoders run 10 minutes each, the other
# 17 run 5 minutes. Pull requests and pushes to main get a fast "build every target"
# job instead.
# Not a substitute for a long-running fuzzing farm: the scheduled job is a daily
# regression gate that keeps the harnesses compiling and catches shallow crashes.
#
# Run it on demand from the Actions tab (`workflow_dispatch`) or locally:
#   cd fuzz && cargo +nightly fuzz build
#   cd fuzz && cargo +nightly fuzz run html_parse -- -max_total_time=30
# See docs/FUZZING.md for the full local workflow and triage policy.

on:
  schedule:
    # Every day at 03:17 UTC (off-peak, away from the top-of-hour Actions spike).
    - cron: "17 3 * * *"
  workflow_dispatch:
  # A manifest/API break in the harness is a hard error, not a flaky run: catch it on
  # the merge that causes it instead of the next morning (the 2026-11 duplicate
  # `[[bin]] font_decode` entry broke every scheduled job for days).
  push:
    branches: [main]
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz-nightly.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz-nightly.yml"
      # The targets link the engine crates: a public API change (e.g. a new field on
      # `megi_svg::Limits` or `megi_image::Limits`) breaks `cargo fuzz build` without touching
      # `fuzz/**`, and the nightly job would only notice a day later.
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast build gate: cargo-fuzz needs nightly (it passes `-Zsanitizer=…` to rustc), so a
  # stable-only build job is not viable. This job compiles every target on nightly but does
  # not run libFuzzer, keeping feedback cheap (~few minutes with the rust-cache below).
  # It runs on pull requests and, since a broken harness on main silences the whole daily
  # matrix, on every push to main that can affect it.
  build:
    name: build all fuzz targets
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          # Pinned date: a new nightly changing `-Zsanitizer` would otherwise break the
          # scheduled job with no PR involved (#698). Bump deliberately.
          toolchain: nightly-2026-10-19

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz -> target

      - name: Cache cargo-fuzz binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked --force

      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

  fuzz:
    name: fuzz ${{ matrix.target }}
    # Only the nightly schedule and explicit dispatches run the 22 libFuzzer budgets:
    # pushes to main are covered by the build gate above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 10 minutes for the critical parsers/decoders (R228).
          - target: html_parse
            seconds: 600
            extra: ""
          - target: css_parse
            seconds: 600
            extra: ""
          - target: selectors
            seconds: 600
            extra: ""
          - target: net_url
            seconds: 600
            extra: ""
          - target: net_surface
            seconds: 300
            extra: ""
          - target: font_decode
            seconds: 300
            extra: ""
          - target: layout_resolve
            seconds: 300
            extra: ""
          - target: dom_mutate
            seconds: 300
            extra: ""
          # Round 18 (R105): render pipeline, JavaScript host and SVG.
          - target: render_pipeline
            seconds: 600
            extra: ""
          - target: js_eval
            # Boa 0.21 leaks a constant ~56 bytes / 2 allocations once per process (checked
            # with -runs=1/10/50: it does not grow per iteration). This is a third-party
            # one-time allocation, not a memory-safety bug in the host; run without LSan
            # like other Boa embeddings do, see docs/FUZZING.md.
            seconds: 600
            extra: "-detect_leaks=0"
          - target: svg_parse
            seconds: 600
            extra: ""
          # Web fonts (@font-face WOFF2) decode untrusted bytes through a third-party
          # converter; header/directory parsing is the hardened surface.
          - target: woff2_decode
            seconds: 300
            extra: ""
          # Round 24 (R151): image decoders/EXIF and HTTP/2 HPACK + framing.
          - target: image_decode
            seconds: 600
            extra: ""
          - target: exif_parse
            seconds: 300
            extra: ""
          - target: hpack_decode
            seconds: 600
            extra: ""
          # Round 29 (R190): HTTP/2 server push, streaming bodies, WebP lossy/lossless
          # sniffing and ES modules + import maps (Boa leak flag as js_eval).
          - target: h2_push
            seconds: 300
            extra: ""
          - target: body_stream
            seconds: 300
            extra: ""
          # WebP container validation and VP8/VP8L decoding in one target (#471):
          # the two old 300 s campaigns overlapped heavily, so their budget is kept
          # as a single 600 s run over the union of both corpora.
          - target: webp
            seconds: 600
            extra: ""
          - target: js_module
            seconds: 300
            extra: "-detect_leaks=0"
          - target: container_queries
            seconds: 300
            extra: ""
          # Ronda 36: byte -> code-point preprocessor (raw lone surrogates, >U+10FFFF).
          - target: text_boundary
            seconds: 300
            extra: ""
          # Direct core-crate harnesses (#834, #716). They were added to the workspace but
          # never got a scheduled budget, so a regression in them only showed up in the
          # weekly soak (or not at all).
          - target: dom_tree
            seconds: 300
            extra: ""
          - target: layout_tree
            seconds: 300
            extra: ""
          - target: paint_display_list
            seconds: 300
            extra: ""
          - target: fonts_shape
            seconds: 300
            extra: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          # Pinned date: a new nightly changing `-Zsanitizer` would otherwise break the
          # scheduled job with no PR involved (#698). Bump deliberately.
          toolchain: nightly-2026-10-19

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # The fuzz harness lives in its own workspace (fuzz/), so cache its target dir.
          workspaces: fuzz -> target

      - name: Cache cargo-fuzz binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked --force

      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz build ${{ matrix.target }}

      # 600 s for the 9 critical parsers/decoders and 300 s for the rest: a daily smoke
      # run, not a coverage-maximising campaign. Raise it via workflow_dispatch edits or
      # run the corpus longer locally before a release.
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=${{ matrix.seconds }}
          -rss_limit_mb=2048
          -timeout=25
          ${{ matrix.extra }}
          -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14


  fuzz-ubsan:
    name: fuzz-ubsan ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Short UndefinedBehaviorSanitizer smoke runs on representative parsers/decoders.
          # Excludes Boa-embedding targets (js_eval/js_module) which carry known third-party
          # leak/compat constraints under sanitizers; they remain covered by the ASan matrix.
          - target: html_parse
            seconds: 120
          - target: css_parse
            seconds: 120
          - target: selectors
            seconds: 120
          - target: net_url
            seconds: 120
          - target: image_decode
            seconds: 120
          - target: hpack_decode
            seconds: 120
          - target: svg_parse
            seconds: 120
          - target: webp
            seconds: 120
          - target: container_queries
            seconds: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          # Pinned date: a new nightly changing `-Zsanitizer` would otherwise break the
          # scheduled job with no PR involved (#698). Bump deliberately.
          toolchain: nightly-2026-10-19

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz -> target

      - name: Cache cargo-fuzz binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked --force

      - name: Build ${{ matrix.target }} (UBSan)
        working-directory: fuzz
        run: cargo +nightly fuzz build --sanitizer undefined ${{ matrix.target }}

      - name: Run ${{ matrix.target }} (UBSan)
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run --sanitizer undefined ${{ matrix.target }} --
          -max_total_time=${{ matrix.seconds }}
          -rss_limit_mb=2048
          -timeout=25
          -print_final_stats=1

      - name: Upload UBSan crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-ubsan-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
