name: Fuzz (nightly)

# Nightly libFuzzer smoke runs over every parser/renderer surface that consumes untrusted
# input, plus a fast "build every target" job on pull requests.
# Not a substitute for a long-running fuzzing farm: the scheduled job is a cheap daily
# regression gate (5 minutes per target) that keeps the harnesses compiling and catches
# shallow crashes.
#
# Run it on demand from the Actions tab (`workflow_dispatch`) or locally:
#   cd fuzz && cargo +nightly fuzz build
#   cd fuzz && cargo +nightly fuzz run html_parse -- -max_total_time=30
# See docs/FUZZING.md for the full local workflow and triage policy.

on:
  schedule:
    # Every day at 03:17 UTC (off-peak, away from the top-of-hour Actions spike).
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz-nightly.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast PR gate: cargo-fuzz needs nightly (it passes `-Zsanitizer=…` to rustc), so a
  # stable-only build job is not viable. This job compiles every target on nightly but does
  # not run libFuzzer, keeping PR feedback cheap (~few minutes with the rust-cache below).
  build:
    name: build all fuzz targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build every target
        working-directory: fuzz
        run: cargo +nightly fuzz build

  fuzz:
    name: fuzz ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 1-7 parsers.
          - target: html_parse
            extra: ""
          - target: css_parse
            extra: ""
          - target: selectors
            extra: ""
          - target: net_url
            extra: ""
          # Round 18 (R105): render pipeline, JavaScript host and SVG.
          - target: render_pipeline
            extra: ""
          - target: js_eval
            # Boa 0.21 leaks a constant ~56 bytes / 2 allocations once per process (checked
            # with -runs=1/10/50: it does not grow per iteration). This is a third-party
            # one-time allocation, not a memory-safety bug in the host; run without LSan
            # like other Boa embeddings do, see docs/FUZZING.md.
            extra: "-detect_leaks=0"
          - target: svg_parse
            extra: ""
          # Round 24 (R151): image decoders/EXIF and HTTP/2 HPACK + framing.
          - target: image_decode
            extra: ""
          - target: exif_parse
            extra: ""
          - target: hpack_decode
            extra: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          # The fuzz harness lives in its own workspace (fuzz/), so cache its target dir.
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz build ${{ matrix.target }}

      # 300 s per target is deliberately short: the goal is a daily smoke run that stays
      # within a few CI minutes, not a coverage-maximising campaign. Raise it via
      # workflow_dispatch edits or run the corpus longer locally before a release.
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: >-
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=300
          -rss_limit_mb=2048
          -timeout=25
          ${{ matrix.extra }}
          -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
