# Line/function coverage for the workspace (#962).
#
# `cargo llvm-cov` instruments the real test suite (not a synthetic harness), so the
# number matches what `cargo test` exercises. Runs weekly and on demand: a coverage
# run is several minutes of CPU and the value is the trend, not per-PR precision.
# The badge in `docs/status/badge-coverage.svg` is regenerated by
# `tools/coverage_report.py --write`; this job uploads the lcov + HTML report and
# writes the summary, and fails only if coverage drops below the floor.
name: coverage

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm-cov:
    name: Workspace coverage (llvm-cov)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/install-system-deps

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run the test suite under instrumentation
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-targets --locked --lcov --output-path target/lcov.info
          cargo llvm-cov report --html --output-dir target/coverage-html

      - name: Summarise coverage
        run: |
          {
            echo '### Coverage (#962)'
            echo
            echo '```'
            python3 tools/coverage_report.py target/lcov.info --min 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            target/lcov.info
            target/coverage-html
          if-no-files-found: warn
