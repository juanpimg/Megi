name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality gate (fmt, clippy, tests, docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install shell system dependencies (winit/softbuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-randr0-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace
      # Checks that PROGRESS.md and docs/status/*.svg match the committed manifest plus the
      # real repository stats (git HEAD/date, crates, Rust lines, test count). The
      # conformance gate already runs in the `conformance` job, so it is not re-run here.
      - name: Status freshness (PROGRESS.md + docs/status)
        run: python3 tools/update_progress.py --check --no-gate
      - name: Documentation
        run: cargo doc --workspace --no-deps

  conformance:
    name: HTML5 conformance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shell system dependencies (winit/softbuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-randr0-dev
      - name: Closed-loop conformance summary (fails on unexpected regressions)
        run: cargo run -p test_harness -- --summary

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Install shell system dependencies (winit/softbuffer)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-randr0-dev
      - name: Check workspace against declared MSRV
        run: cargo check --workspace --all-targets

  minimal:
    name: JS-free build (--no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `js` and `render` are the only crates with a `js` feature, and a workspace-wide
      # `--no-default-features` still links Boa through `shell`/`test_harness`, so the
      # documented JS-free build is checked per crate (no system libraries needed here).
      - name: Clippy the renderer without the JavaScript engine
        run: cargo clippy -p render --no-default-features --all-targets -- -D warnings
      - name: Clippy the engine stub
        run: cargo clippy -p js --no-default-features --all-targets -- -D warnings
      - name: Test the engine stub
        run: cargo test -p js --no-default-features
      - name: Test the renderer without scripts
        run: cargo test -p render --no-default-features
