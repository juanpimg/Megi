name: CI

on:
  push:
    branches: [main]
  # No top-level `paths-ignore`: a skipped workflow never reports the `check`
  # umbrella, which branch protection requires. Docs-only PRs are classified by
  # the `changes` job below, which skips the heavy Rust jobs while keeping the
  # lightweight gates (and `check`) green (#485).
  pull_request:
  # Merge-queue pushes fire `merge_group`, not `push`/`pull_request`; without this
  # trigger a queued merge lands with no CI run at all (issue #697).
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly toolchain drift gate: the pinned jobs below keep `main` reproducible,
    # this run is the only one that floats and reports new rustc breakage (#698).
    - cron: "23 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Classify PRs so a docs-only change does not spin up the full Rust matrix (#485).
  # This job runs on *every* event and reports `docs_only=false` outside PRs:
  # a skipped `changes` job would implicitly skip all jobs that `needs` it,
  # including on push/merge_group, silently disabling the whole Rust matrix.
  changes:
    name: Classify PR changes
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push / merge_group / schedule / workflow_dispatch: always run the
            # full matrix, as before the docs-only optimisation.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD) || { echo "::error::cannot diff against $base"; exit 1; }
          if [ -z "$changed" ]; then
            echo "::error::empty change set"
            exit 1
          fi
          docs_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # Lightweight docs gate: it must keep running on docs-only PRs so a stale
  # generated PROGRESS.md / docs/status snapshot still fails the build (#485).
  docs:
    name: Docs freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # `update_coverage.py --check` verifies that gate.verified_commit is HEAD or an
      # ancestor, so this job needs full history (a depth-1 checkout hides that commit).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      # whatwg_spec.py (imported by the tools tests below) needs lxml to parse the
      # cached WHATWG spec pages; setup-python does not install it.
      - name: Install Python test dependencies
        run: python3 -m pip install lxml
      - name: Status freshness (PROGRESS.md + docs/status)
        run: python3 tools/update_progress.py --check --no-gate
      - name: Coverage freshness (capability manifest + artifacts)
        run: python3 tools/update_coverage.py --check
      # The audit ledger is the durable record of the line-by-line review: it must
      # know every tracked file and fail when one changes without being re-read
      # (docs/audit/README.md).
      - name: Audit coverage ledger
        run: python3 tools/audit_coverage.py --check
      # One canonical copy per fixture byte sequence (#1432): render aliases are symlinks.
      - name: Fixture hash uniqueness
        run: python3 tools/check_fixture_hashes.py
      - name: Tools tests (all modules)
        # Run every tools test module explicitly (#1402): a `test_*.py` glob would also
        # pick up test_inspector.py, which is a CLI, not a test module.
        run: >-
          python3 -m unittest
          tools.test_audit_coverage
          tools.test_update_coverage
          tools.test_png_check
          tools.test_real_site_check
          tools.test_check_arch
          tools.test_soak_fuzz
          tools.test_bench_compare
          tools.test_check_sbom
          tools.test_ci_gate
          tools.test_exif_generators
          tools.test_fuzz_cache
          tools.test_image_docs
          tools.test_perf_measurer_doc

  quality:
    name: Quality gate (fmt, clippy, tests, docs)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Same ancestry check as the docs job: full history is required for
      # `update_coverage.py --check` to resolve gate.verified_commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned so a new rustc cannot break `clippy -D warnings` without a PR (#698).
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/install-system-deps
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Enforces the crate DAG, forbidden ownership patterns and file-size caps
      # from docs/superpowers/specs/2026-11-18-megi-modular-architecture-design.md.
      - name: Architecture DAG and file-size check
        run: python3 tools/check_arch.py
      # The light WebView must not link Boa or any windowing backend.
      - name: Light WebView build (no JS, no UI)
        run: |
          set -o pipefail
          cargo check -p megi-webview --no-default-features
          cargo test -p megi-webview --no-default-features
          # #2138: capture cargo tree's output before grepping so its own exit
          # status is observed. `! cargo tree ... | grep` fails open: without
          # pipefail a failing `cargo tree` feeds grep an empty input, grep
          # returns 1, and `!` turns the whole pipeline green. The dependency
          # tree command must succeed; only then may the forbidden-dep grep fail.
          tree="$(cargo tree -p megi-webview --no-default-features -e normal)"
          ! grep -Eqi 'boa|winit|softbuffer' <<<"$tree"
      - name: Workspace tests
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --locked 2>&1 | tee /tmp/workspace-tests.log
      # `--all-targets` does not include doctests (#1480): run them explicitly so broken
      # documentation examples in `image`/`fonts` cannot ship green.
      - name: Doctests
        run: cargo test --workspace --doc --locked
      # Checks that PROGRESS.md and docs/status/*.svg match the committed manifest plus the
      # real repository stats (git HEAD/date, crates, Rust lines, test count). The
      # conformance gate already runs in the `conformance` job, so it is not re-run here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Status freshness (PROGRESS.md + docs/status)
        run: python3 tools/update_progress.py --check --no-gate
      - name: Coverage freshness (capability manifest + artifacts)
        run: python3 tools/update_coverage.py --check
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workspace-test-logs
          path: /tmp/workspace-tests.log
          retention-days: 7
          if-no-files-found: ignore

  conformance:
    name: HTML5 conformance gate
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/install-system-deps
      - name: Closed-loop conformance summary (fails on unexpected regressions)
        run: |
          set -o pipefail
          cargo run --locked -p megi-test-harness -- --summary 2>&1 | tee /tmp/conformance.log
      - name: Upload conformance log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conformance-log
          path: /tmp/conformance.log
          retention-days: 7
          if-no-files-found: ignore

  msrv:
    name: MSRV (Rust 1.91)
    needs: [changes, quality]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/install-system-deps
      - name: Check workspace against declared MSRV
        run: cargo check --workspace --all-targets --locked
      # The MSRV gate must also cover the documented JS-free build, not just the
      # default one (#52).
      - name: Check the JS-free configuration against the MSRV
        run: |
          cargo check -p megi-js --no-default-features --all-targets --locked
          cargo check -p megi-render --no-default-features --all-targets --locked

  minimal:
    name: JS-free build (--no-default-features)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `js` and `render` are the only crates with a `js` feature, and a workspace-wide
      # `--no-default-features` still links Boa through `shell`/`test_harness`, so the
      # documented JS-free build is checked per crate (no system libraries needed here).
      - name: Clippy the renderer without the JavaScript engine
        run: cargo clippy -p megi-render --no-default-features --all-targets --locked -- -D warnings
      - name: Clippy the engine stub
        run: cargo clippy -p megi-js --no-default-features --all-targets --locked -- -D warnings
      - name: Test the engine stub
        run: cargo test -p megi-js --no-default-features --locked
      - name: Test the renderer without scripts
        run: cargo test -p megi-render --no-default-features --locked

  package:
    name: Packaging dry-run
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Verifies every workspace crate can be packaged (manifest/path-dependency
      # requirements) without building the packages.
      - name: cargo package (no verify)
        run: cargo package --workspace --locked --allow-dirty --no-verify

  security:
    name: Dependency security (audit/deny)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

  unsafe-audit:
    name: Unsafe audit (cargo-geiger)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/install-system-deps
      - name: Install cargo-geiger
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-geiger
      - name: cargo geiger (forbid-only check)
        run: |
          set -e
          # #2171: one JSON document per crate would concatenate into invalid
          # JSON. Write each to its own file, then combine into a single array.
          rm -rf /tmp/geiger-parts && mkdir -p /tmp/geiger-parts
          i=0
          for manifest in crates/*/Cargo.toml; do
            echo "=== cargo geiger --manifest-path $manifest ==="
            cargo geiger --manifest-path "$PWD/$manifest" --all-features --all-targets --forbid-only --output-format Json > "/tmp/geiger-parts/$i.json"
            i=$((i + 1))
          done
          python3 -c 'import json,glob; json.dump([json.load(open(f)) for f in sorted(glob.glob("/tmp/geiger-parts/*.json"), key=lambda p:int(p.rsplit("/",1)[1][:-5]))], open("/tmp/geiger.json","w"))'
      - name: Upload geiger report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-geiger-report
          path: /tmp/geiger.json
          retention-days: 7
          if-no-files-found: ignore

  workflow-lint:
    name: Workflow and shell lint (actionlint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Release tarballs pinned by version *and* checksum: the lint gate itself must
      # not reintroduce the floating-installer problem it is meant to catch (#713/#828).
      - name: Install actionlint 1.7.12
        run: |
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
      - name: actionlint (workflows)
        run: actionlint -color
      - name: Install shellcheck 0.11.0
        run: |
          curl -sSfL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: shellcheck (tools/*.sh)
        run: shellcheck -S warning tools/*.sh

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the full history on push, not just the last commit
      # Pinned by version and checksum, like the other third-party tools in CI.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks (tracked content and history)
        run: gitleaks detect --no-banner --redact --config .gitleaks.toml --log-level warn

  docs-links:
    name: Documentation links (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Offline by design: the repository controls its own relative links and
      # anchors, while third-party spec URLs are noisy and need network (#725).
      - name: Check relative links and anchors in the docs
        run: python3 tools/check_docs_links.py

  toolchain-drift:
    name: Toolchain drift (newest stable)
    # The only job that deliberately floats: everything else is pinned, so this
    # weekly run is what reports a new rustc breaking `clippy -D warnings` (#698).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/install-system-deps
      - name: fmt, clippy and tests on the floating stable
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked

  release:
    name: Release tests (conformance & overflow checks)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: ./.github/actions/install-system-deps
      - name: Release-profile tests (core crates)
        run: |
          cargo test --release --locked --lib \
            -p megi-core -p megi-html -p megi-css -p megi-layout -p megi-fonts -p megi-image -p megi-paint -p megi-net -p megi-svg -p megi-js
      - name: Release conformance summary
        run: cargo run --release --locked -p megi-test-harness -- --summary

  # Umbrella job for branch protection: a single required check that aggregates
  # every gate above (#577). Branch protection can require just `check`.
  # A gate skipped by the docs-only classifier is not a failure (#485): the
  # lightweight gates still run, so `check` always reports a definitive result.
  check:
    name: CI umbrella (all gates)
    runs-on: ubuntu-24.04
    needs:
      - changes
      - docs
      - quality
      - conformance
      - release
      - msrv
      - minimal
      - package
      - security
      - unsafe-audit
      - workflow-lint
      - secret-scan
      - docs-links
    if: always()
    steps:
      - name: Verify all required gates succeeded
        run: |
          results="${{ needs.changes.result }} ${{ needs.docs.result }} \
          ${{ needs.quality.result }} ${{ needs.conformance.result }} \
          ${{ needs.release.result }} ${{ needs.msrv.result }} \
          ${{ needs.minimal.result }} ${{ needs.package.result }} \
          ${{ needs.security.result }} ${{ needs.unsafe-audit.result }} \
          ${{ needs.workflow-lint.result }} ${{ needs.secret-scan.result }} \
          ${{ needs.docs-links.result }}"
          for result in $results; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "One or more required gates failed: $results" >&2
              exit 1
            fi
          done
          echo "All required gates succeeded."
