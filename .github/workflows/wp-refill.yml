name: WP refill

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Generate work packages from real artifacts
        run: |
          python3 tools/wp_generate.py --all
          python3 tools/wp_plan.py --board
          python3 tools/wp_dashboard.py --write
      - name: Verify generated artifacts
        run: python3 tools/wp_dashboard.py --check
      - name: Commit queue refresh
        run: |
          git config user.name "megi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/work-packages/ docs/status/work-packages.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(wp): refill queue from real artifacts"
            git push
          fi
      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          summary=$(python3 -c 'import sys, pathlib; sys.path.insert(0, "tools"); from tools import wp_dashboard as w; d = w.collect(pathlib.Path(".")); print("closed=%d queued=%d light=%d heavy=%d" % (d["closed"], d["queued"], d["light"], d["heavy"]))')
          issue=$(gh issue list --state open --label wp-board --json number --jq '.[0].number' || true)
          if [ -z "$issue" ]; then
            gh issue create --title "Work package board — through 2026" \
              --label wp-board --body "Cola regenerada por \`wp-refill.yml\`. Estado real: $summary"
          else
            gh issue comment "$issue" --body "Reposición automática: $summary"
          fi
