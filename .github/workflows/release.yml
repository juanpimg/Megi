name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-shm0-dev libxcb-randr0-dev
      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p shell -p render -p test_harness -p bench
      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          DIST="dist/megi-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$DIST"
          for bin in megi render test_harness bench; do
            if [ -f "target/${{ matrix.target }}/release/$bin" ]; then
              cp "target/${{ matrix.target }}/release/$bin" "$DIST/"
            fi
          done
          cp LICENSE* README.md CHANGELOG.md "$DIST/" 2>/dev/null || true
          tar -C dist -czf "megi-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" "$(basename "$DIST")"
      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/megi-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          foreach ($bin in @("megi","render","test_harness","bench")) {
            $p = "target/${{ matrix.target }}/release/$bin.exe"
            if (Test-Path $p) { Copy-Item $p "$dist/" }
          }
          foreach ($f in @("README.md","CHANGELOG.md")) { if (Test-Path $f) { Copy-Item $f "$dist/" } }
          Get-ChildItem -Path . -Filter "LICENSE*" | ForEach-Object { Copy-Item $_.FullName "$dist/" }
          Compress-Archive -Path "$dist/*" -DestinationPath "megi-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - name: Generate checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          shasum -a 256 "megi-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" > "megi-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"
      - name: Generate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $file = "megi-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            megi-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.artifact_ext }}
            megi-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.artifact_ext }}.sha256
          if-no-files-found: error

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-cyclonedx
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --all --format json --override-filename sbom
      - name: Collect SBOM files
        shell: bash
        run: |
          mkdir -p sbom-dist
          find . -name '*sbom*.json' -not -path './sbom-dist/*' -print -exec cp {} sbom-dist/ \; || true
          # Fallback: workspace-level BOM name may vary
          if [ -z "$(ls -A sbom-dist 2>/dev/null)" ]; then
            cargo cyclonedx --format json || true
            find . -name '*.cdx.json' -o -name 'bom.json' -o -name 'sbom*.json' | head -20 | xargs -I{} cp {} sbom-dist/ || true
          fi
          ls -la sbom-dist || true
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom-dist/
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Download SBOM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: release-assets/sbom
      - name: Generate release notes (git-cliff)
        id: git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: List release assets
        run: find release-assets -type f -ls
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="${{ steps.git-cliff.outputs.changelog }}"
          if [ -z "$NOTES_FILE" ] || [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="CHANGES.md"
          fi
          if [ -f "$NOTES_FILE" ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file "$NOTES_FILE" \
              release-assets/megi-* release-assets/sbom/* 2>/dev/null || \
            gh release upload "${{ github.ref_name }}" release-assets/megi-* release-assets/sbom/* --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              release-assets/megi-* release-assets/sbom/* 2>/dev/null || \
            gh release upload "${{ github.ref_name }}" release-assets/megi-* release-assets/sbom/* --clobber
          fi
