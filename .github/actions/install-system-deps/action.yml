name: Install system dependencies
description: >-
  Install the Wayland/X11/xkb development packages that `winit` and
  `softbuffer` need to link. One implementation for every job that builds the
  shell (issue #826).

runs:
  using: composite
  steps:
    - name: apt-get install (Wayland/X11/xkb)
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev \
          libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxcb-shm0-dev libxcb-randr0-dev
