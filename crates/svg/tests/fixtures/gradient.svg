<svg xmlns="http://www.w3.org/2000/svg" width="120" height="60" viewBox="0 0 120 60">
  <style>
    .sky { fill: url(#sky); }
    .accent, #accent { stroke: url(#warm); stroke-width: 3; }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.4" r="0.5" fx="0.4" fy="0.3">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.6" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect class="sky" width="120" height="60"/>
  <rect x="6" y="6" width="108" height="48" fill="url(#sun)"/>
  <circle cx="60" cy="30" r="14" class="accent" fill="none"/>
  <polyline id="accent" points="10,52 30,40 50,52 70,40 90,52 110,40" fill="none"/>
</svg>
