      <rect width="8" height="16" fill="#e63946"/>
      <rect x="8" width="8" height="16" fill="#1d3557"/>
    </pattern>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="12" height="12"
             patternTransform="translate(3 0)">
