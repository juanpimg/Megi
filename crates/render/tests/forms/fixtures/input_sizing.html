<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>form control sizing fixture</title>
</head>
<body style="margin:0;font:16px sans-serif">
  <div style="width:780px;padding:10px">
    <form style="margin:0">
      <input type="search" name="q" size="57" value="site:example.com query"><button type="submit">Search</button>
    </form>
    <input type="text" size="10">
    <input type="text" size="57">
    <input type="text" size="57" style="width:496px;height:30px">
    <select>
      <option>short</option>
      <option>a rather long option label that must not be clipped</option>
    </select>
  </div>
</body>
</html>
