[package]
name = "render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Megi Engine — first real browser pipeline: URL → HTML → external CSS → layout → PNG"

[features]
# JavaScript integration is on by default; `--no-default-features` builds a renderer
# whose `ScriptingMode` default is `Disabled` and that does not link the `js` crate/engine.
default = ["js"]
js = ["dep:js"]

[dependencies]
dom.workspace = true
html.workspace = true
css.workspace = true
layout.workspace = true
fonts.workspace = true
paint.workspace = true
net.workspace = true
image.workspace = true
js = { workspace = true, optional = true }
svg.workspace = true

[[bin]]
name = "render"
path = "src/main.rs"

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true
