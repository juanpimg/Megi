[package]
name = "megi-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Megi Engine — first real browser pipeline: URL → HTML → external CSS → layout → PNG"

[features]
# JavaScript integration is on by default; `--no-default-features` builds a renderer
# whose `ScriptingMode` default is `Disabled` and that does not link the `js` crate/engine.
default = ["js"]
js = ["dep:megi-js"]
# Enable PAC proxy auto-configuration: net defines the trait, render supplies the JS evaluator.
pac = ["megi-net/pac"]

[dependencies]
megi-core.workspace = true
megi-html.workspace = true
megi-css.workspace = true
megi-layout.workspace = true
megi-fonts.workspace = true
megi-paint.workspace = true
megi-net.workspace = true
megi-image.workspace = true
megi-js = { workspace = true, optional = true }
megi-svg.workspace = true

[[bin]]
name = "render"
path = "src/main.rs"

[dev-dependencies]
rcgen.workspace = true
rustls.workspace = true

[lints]
workspace = true
