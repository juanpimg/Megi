[package]
name = "megi-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Megi Engine — Phase 7 desktop shell: winit window + softbuffer presentation and headless screenshots"

[features]
default = ["a11y"]
# ADR-002: platform accessibility backend (AT-SPI/UIA/NSAccessibility via AccessKit).
a11y = ["dep:accesskit"]

[dependencies]
megi-webview = { workspace = true, features = ["full"] }
winit.workspace = true
softbuffer.workspace = true
accesskit = { version = "0.25", optional = true }

[[bin]]
name = "megi"
path = "src/main.rs"

[lints]
workspace = true
