[package]
name = "megi-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Megi Engine — Phase 5 network stack: WHATWG URL subset, HTTP/1.1 client with TLS 1.2/1.3 (rustls), HTTP cache, data: URLs, file:// loader, MIME sniffing and a resource loader"

[dependencies]
megi-image = { workspace = true }
rustls = { workspace = true, optional = true }
# ADR-003: pure-Rust Brotli inflate for Content-Encoding: br (no C/FFI).
brotli = "9"
webpki-roots = { workspace = true, optional = true }

[features]
default = ["tls"]
# PAC/WPAD auto-configuration. The script evaluator is injected via PacEvaluator;
# no JavaScript dependency is pulled into the network crate.
pac = []
# TLS 1.2/1.3 transport for https: (rustls + webpki-roots Mozilla root store).
tls = ["dep:rustls", "dep:webpki-roots"]

[dev-dependencies]
rcgen = { workspace = true }
# TLS tests build client/server configs directly; always available to dev targets.
rustls = { workspace = true }
# PAC integration tests inject a JS-backed evaluator; production builds never link it.
megi-js = { workspace = true }

[lints]
workspace = true
