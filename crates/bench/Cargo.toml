[package]
name = "megi-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Megi Engine — reproducible end-to-end benchmarks (parse, style, layout, paint, PNG)"

[dependencies]
megi-core.workspace = true
megi-html.workspace = true
megi-css.workspace = true
megi-layout.workspace = true
megi-paint.workspace = true
megi-render = { workspace = true, features = ["js"] }
megi-image.workspace = true
megi-fonts = { workspace = true, optional = true }

[features]
# The font benchmarks are opt-in: they need the bundled DejaVu fixture and the
# `fonts` crate (still being migrated in the sprint branch). Enable with
# `cargo run --release -p megi-bench --features fonts`.
default = []
fonts = ["dep:megi-fonts"]

[lints]
workspace = true
